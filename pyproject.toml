[project]
name = "nam-autoresearch"
version = "0.1.0"
description = "Autonomous architecture search for neural amp modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "requests>=2.32.0",
    "torch==2.9.1",
    # Loss definitions, WaveNet, and wav IO are reused from NAM itself rather than
    # reimplemented, so numbers out of this harness stay comparable with published
    # NAM/A2 results. Tracks the fork rather than PyPI.
    "neural-amp-modeler",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
neural-amp-modeler = { git = "https://github.com/mycosavant/neural-amp-modeler", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
